<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Happen to Have?">
  <!--
    A favicon is fetched and parsed as image/svg+xml, which is STRICT XML: an XML
    comment may not contain a double hyphen, so CSS custom properties cannot be named
    here in prose. An earlier revision wrote the green token with its leading hyphens
    and the whole file failed to parse, which shows as no favicon at all rather than
    as an error anywhere. Validate edits by parsing, not by dropping the markup into
    an HTML page: the HTML parser is lenient and accepts what a browser will reject.

    Solid green tile with the glyph knocked out, not a light plate carrying a green
    mark. At 16px on a dark tab strip the thin glyph disappeared and only the plate
    read; a filled tile holds its shape on any tab colour, so no prefers-color-scheme
    variant is needed. Drawn as a path rather than text because browser chrome does
    not load the page webfonts.
  -->
  <title>Happen to Have?</title>
  <rect width="64" height="64" rx="13" fill="#2e7d4f"/>
  <g transform="translate(32 32) scale(1.16) translate(-32 -32)" fill="#fafaf7">
    <path d="M32 8c-8.4 0-15 5.2-15.7 12.9-.1 1.6 1.1 3 2.7 3h4.3c1.4 0 2.5-1 2.8-2.4.6-3 2.9-4.9 6-4.9 3.4 0 5.8 2.1 5.8 5 0 2.6-1.1 4-4.2 6.1-3.6 2.4-5.3 4.9-5.1 9.1l.1 1.6c.1 1.5 1.3 2.6 2.8 2.6h3.6c1.6 0 2.8-1.3 2.8-2.9 0-2.5 1-3.9 4.2-6 3.7-2.5 5.9-5.6 5.9-10.1C47.9 13.6 41.2 8 32 8Z"/>
    <circle cx="32" cy="52" r="4.6"/>
  </g>
</svg>
