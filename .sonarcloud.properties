# SonarCloud Automatic Analysis. Analysis runs server-side on push, so there is no scanner
# step in the CI workflow and no SONAR_TOKEN — that job was removed because it failed every
# run with "Not authorized or project not found".
#
# Automatic Analysis cannot ingest coverage reports; that requires a CI-based scan. No
# lcov path is declared here rather than pointing at a file nothing generates.

sonar.sources=app,src,seed,scripts
sonar.tests=tests

# Generated, vendored, or non-source trees. `migrations` is deliberately absent from
# sonar.sources: it is the schema of record, applied by node-pg-migrate, and its SQL is not
# application code to be linted.
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/test-results/**,**/playwright-report/**,**/*.md,public/**,migrations/**

# Test files are analysed as tests, not held to source rules.
sonar.test.inclusions=tests/**

# Duplication detection off for tests and spike scripts, for the same reason in both cases:
# the repetition is what makes each file independently runnable.
#
# Each integration suite defines its own createParticipant/createQuestion/publishAnswer
# fixtures and its own PGlite setup block, so CPD sees three near-identical copies. A shared
# fixture module couples suites that must be able to change independently, and a test that
# reaches into shared setup stops being readable on its own.
#
# Each scripts/spike file is one measurement run against the live provider — same client
# setup, same fixture loop, same result-writing tail. Factoring that out would couple
# experiments whose whole purpose is to differ in exactly one variable, and would leave a
# committed baseline in tests/fixtures/results that no single file reproduces. These scripts
# are evidence, not application code.
#
# Application source is still checked for duplication.
sonar.cpd.exclusions=tests/**,scripts/spike/**
