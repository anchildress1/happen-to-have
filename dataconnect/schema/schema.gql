# Schema for 001-participant-and-pool. See specs/001-participant-and-pool/data-model.md
# for the authoritative column list — only what this feature reads or writes lives here.
# Specs 002-005 add their own columns in their own migrations (data-model.md, "Columns
# deliberately deferred").

# 'open' and 'closed' are lowercase to match the literal SQL Connect writes and every other
# spec compares against ('open' seeded, 'closed' set by 004) — not the enum-value naming
# convention Data Connect otherwise recommends (UPPER_SNAKE_CASE).
enum QuestionStatus {
  open
  closed
}

# One anonymous, session-scoped person (data-model.md#participants).
# can_ask is read-only in this feature: 003 grants it, 004 consumes it. No name, username,
# profile, or credential column exists here — the schema itself enforces FR-003.
type Participant @table(name: "participants") {
  id: UUID! @default(sql: "gen_random_uuid()")
  canAsk: Boolean! @default(value: false)
  createdAt: Timestamp! @default(sql: "now()")
}

# A published question available to be answered (data-model.md#questions).
# participantId is nullable: NULL marks a seeded question (FR-028), not a participant-owned
# one. status is written only by 004; this feature only reads it. No expires_at exists —
# unanswered questions never expire (FR-019).
type Question @table(name: "questions") {
  id: UUID! @default(sql: "gen_random_uuid()")
  participant: Participant
  displayText: String!
  sourceLanguage: String! @default(value: "en")
  status: QuestionStatus! @default(value: open) @index
  createdAt: Timestamp! @default(sql: "now()")
}

# A published answer (data-model.md#answers). Only published answers ever become rows —
# withheld, failed, or abandoned attempts leave no row (constitution Principle V). There is
# deliberately no status/processing/attempt/error column: existence of the row IS
# publication. The unique constraint prevents two concurrent published answers by the same
# participant to the same question, and doubles as the answers(participant_id, question_id)
# index data-model.md calls for. questionId carries its own index so COUNT(*) per question
# (the fewer-answers bias and 004's three-answer closure rule) never needs a denormalized,
# driftable counter.
type Answer @table(name: "answers") @unique(fields: ["participantId", "questionId"]) {
  id: UUID! @default(sql: "gen_random_uuid()")
  question: Question! @ref(fields: "questionId", references: "id")
  questionId: UUID! @index
  participant: Participant! @ref(fields: "participantId", references: "id")
  participantId: UUID!
  createdAt: Timestamp! @default(sql: "now()")
}
